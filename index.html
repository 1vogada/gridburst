<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2cc4b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gridburst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#45dccf}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#2cc4b8}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#159c94}
:root{--bg1:#45dccf;--bg2:#2cc4b8;--bg3:#159c94;transition:--bg1 1.5s,--bg2 1.5s,--bg3 1.5s;--txt:#fff;--gold:#ffcf2e;--font:"Fredoka","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color:var(--txt);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg3)}
body{background:radial-gradient(80% 30% at 50% 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{width:100%;max-width:520px;padding:10px 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.best{font-size:16px;font-weight:700;color:#fff;display:flex;gap:5px;align-items:center;text-shadow:0 1px 0 rgba(0,0,0,.22),0 0 6px rgba(0,0,0,.18)}
.best svg{width:22px;height:18px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.btns{display:flex;gap:7px}
button.icon{background:rgba(0,0,0,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.14)}
button.icon:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.14)}
.score{font-size:58px;line-height:1;font-weight:700;text-align:center;letter-spacing:1px;margin-top:-2px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.16),0 0 14px rgba(0,0,0,.12);transition:transform .12s}
.score.bump{transform:scale(1.1)}
.streak{height:20px;text-align:center;font-size:15px;font-weight:700;color:#fff6b0;opacity:0;transition:opacity .2s;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.streak.on{opacity:1}
canvas{touch-action:none;display:block}
#over{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,40,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);padding:16px}
#over.show{display:flex;animation:fade .3s}
.gb-low #over{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(6,10,40,.8)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{text-align:center;width:100%;max-width:340px;background:linear-gradient(var(--bg1),var(--bg3));border-radius:24px;padding:28px 20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.t1{font-size:28px;font-weight:700;margin-bottom:14px}
.lbl{font-size:14px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.big{font-size:58px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.nb{display:none;color:#fff27a;font-weight:700;font-size:19px;margin-bottom:6px}
.nb.on{display:block;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#again{margin-top:18px;width:100%;height:56px;border:0;border-radius:16px;font-family:var(--font);font-size:21px;font-weight:700;color:#5a2a00;background:linear-gradient(#ffe766,#ffb703);box-shadow:0 5px 0 #c77c00;cursor:pointer}
#again:active{transform:translateY(3px);box-shadow:0 2px 0 #c77c00}
#omenu{margin-top:10px;width:100%;height:44px;border:0;border-radius:14px;font-family:var(--font);font-size:17px;font-weight:700;color:#fff;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);cursor:pointer}
.away{min-height:22px;margin-top:8px;font-size:16px;font-weight:700;color:#fff6b0}
body.lefty .top{flex-direction:row-reverse}
body.bigtext .score{font-size:70px}
body.bigtext .best{font-size:19px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="best"><svg viewBox="0 0 30 24" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset=".55" stop-color="#ffc21a"/><stop offset="1" stop-color="#e88a00"/></linearGradient></defs><path d="M3 20 1.5 6.5l7 5.5L15 2l6.5 10 7-5.5L27 20z" fill="url(#cg)" stroke="#a85a00" stroke-width="1.6" stroke-linejoin="round"/><rect x="3" y="19" width="24" height="3.6" rx="1.6" fill="#ffb300" stroke="#a85a00" stroke-width="1.4"/></svg><span id="best">0</span></div>
    <div class="btns">
      <button class="icon" id="menuBtn" aria-label="Menu">☰</button>
      <button class="icon" id="restart" aria-label="Restart">↻</button>
      <button class="icon" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <div class="score" id="score">0</div>
  <div class="streak" id="streak">Combo x2</div>
</header>
<canvas id="c"></canvas>
<div id="over" role="dialog" aria-modal="true">
  <div class="card">
    <div class="t1">Game Over</div>
    <div class="lbl">Score</div>
    <div class="big" id="oscore">0</div>
    <div class="nb" id="newbest">New best!</div>
    <div class="lbl">Best <span id="obest">0</span></div>
    <div class="away" id="away"></div>
    <button id="again">Play again</button>
    <button id="omenu">Menu</button>
  </div>
</div>
<script src="settings.js?v=11"></script>
<script src="pieces.js?v=11"></script>
<script src="scoring.js?v=11"></script>
<script src="skins.js?v=11"></script>
<script src="menu.js?v=11"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;   // swapped to the board layer's context while that layer is painted
// Full-screen overlay for the dragged piece, so it can float above the board over the score like the original.
const ov = document.createElement('canvas'), ovCtx = ov.getContext('2d');
ov.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5';
document.body.appendChild(ov);
let ovUsed = false, ovX = 0, ovY = 0, ovBox = null, ovFull = false;   // ovBox: area drawn last frame, in canvas px
ov.style.display = 'none';
const N = 8;
// 0-7: piece colours. 8+: stage skins; inside a stage every block on the board wears one of these.
const COLORS = ['#f23d3d','#ff8c1a','#ffc61a','#3fcf3a','#16c3ee','#3566f2','#9a4dff','#ff4fa8',
                '#3d9cff','#ff8cc3','#e9fff5','#b28cff','#ffb84d'];
const PIECE_COLORS = 8;
const PATTERN = { 9: 'gingham', 10: 'dots', 12: 'dots' };
const FONT = '"Fredoka","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// ---------- settings owned by the game itself ----------
const GS = window.GBSettings;
const has = k => GS && GS.specs().some(x => x.key === k);
const def = (k, spec) => { if (GS && !has(k)) GS.define(k, spec); };
const opt = (k, d) => { if (!GS) return d; const v = GS.get(k); return v === undefined ? d : v; };
def('gameplay.leftHanded', { type: 'toggle', group: 'Layout', label: 'Left-handed', def: false, help: 'Moves the header buttons to the left and mirrors the sideways drag offset.' });
def('gameplay.prefill', { type: 'toggle', group: 'New game', label: 'Start with a filled board', def: true, help: 'New games start with a scattered pattern of blocks, like the original.' });
def('gameplay.intro', { type: 'toggle', group: 'New game', label: 'Colorful opening', def: true, help: 'The first 1,500 points use the teal theme with multicolor blocks.' });
def('gameplay.theme', { type: 'select', group: 'Look', label: 'Theme', def: 'auto', options: [{ v: 'auto', label: 'Follow stages' }, { v: '0', label: 'Teal' }, { v: '1', label: 'Blue' }, { v: '2', label: 'Pink' }, { v: '3', label: 'Green' }, { v: '4', label: 'Violet' }, { v: '5', label: 'Sunset' }] });
def('gameplay.ghost', { type: 'toggle', group: 'Board', label: 'Ghost preview', def: true, help: 'Shows where the piece will land.' });
def('gameplay.lineHint', { type: 'toggle', group: 'Board', label: 'Highlight lines about to clear', def: true });
def('gameplay.gridLines', { type: 'toggle', group: 'Board', label: 'Grid lines', def: true });
def('gameplay.boardGlow', { type: 'toggle', group: 'Board', label: 'Glow during long combos', def: false });
def('gameplay.comboFrom', { type: 'slider', group: 'Board', label: 'Glow starts at combo', def: 3, min: 1, max: 15, step: 1 });
def('gameplay.dimTray', { type: 'toggle', group: 'Board', label: 'Dim pieces that do not fit', def: true });
def('gameplay.comboBadge', { type: 'toggle', group: 'HUD', label: 'Combo badge under the score', def: false });
def('gameplay.confirmRestart', { type: 'toggle', group: 'HUD', label: 'Ask before restarting', def: true });
def('gameplay.awayFromBest', { type: 'toggle', group: 'Game over', label: 'Show how far from your best', def: false });
def('gameplay.bestParty', { type: 'toggle', group: 'Game over', label: 'Celebrate a new best', def: true });
def('gameplay.stats', { type: 'toggle', group: 'Stats', label: 'Keep stats', def: true });
def('effects.speed', { type: 'slider', group: 'General', label: 'Animation speed', def: 1, min: 0.25, max: 2.5, step: 0.05, unit: 'x' });
def('effects.particles', { type: 'slider', group: 'General', label: 'Particles', def: 1, min: 0, max: 2.5, step: 0.05, unit: 'x' });
def('effects.shake', { type: 'slider', group: 'General', label: 'Screen shake', def: 1, min: 0, max: 2.5, step: 0.05, unit: 'x' });
def('effects.flash', { type: 'slider', group: 'General', label: 'Screen flash', def: 1, min: 0, max: 2, step: 0.05, unit: 'x' });
def('effects.popupSize', { type: 'slider', group: 'Text', label: 'Combo text size', def: 1, min: 0.5, max: 1.8, step: 0.05, unit: 'x' });
def('effects.points', { type: 'toggle', group: 'Text', label: 'Floating +points', def: true });
def('effects.perfect', { type: 'toggle', group: 'Text', label: '"Perfect!" text', def: true });
def('effects.perfectRule', { type: 'select', group: 'Text', label: '"Perfect!" shows when', def: 'fit', options: [{ v: 'fit', label: 'A piece fills its gap exactly' }, { v: 'lines', label: '2 or more lines clear at once' }], help: 'In the recording it followed snug fits, not line counts (best guess).' });
def('effects.pointsFly', { type: 'toggle', group: 'Text', label: '+points fly into the score', def: true, help: 'The score only counts up once the points arrive, like the original.' });
def('effects.debris', { type: 'toggle', group: 'Clears', label: 'Flying block pieces', def: false, help: 'Small blocks burst off cleared lines. The original only flashes the line.' });
def('gameplay.hintPulse', { type: 'toggle', group: 'Board', label: 'Pulse the lines about to clear', def: false });
def('effects.banners', { type: 'toggle', group: 'Text', label: 'Big banners (Comeback, Combo Master)', def: true });
def('effects.countSpeed', { type: 'slider', group: 'Text', label: 'Score count-up speed', def: 1, min: 0.2, max: 5, step: 0.1, unit: 'x' });
def('effects.beams', { type: 'toggle', group: 'Clears', label: 'Light beams on cleared lines', def: true });
def('effects.gems', { type: 'toggle', group: 'Clears', label: 'Gems flying to the score', def: true });
def('effects.sparkles', { type: 'toggle', group: 'Clears', label: 'Sparkles', def: true });
def('effects.rings', { type: 'toggle', group: 'Clears', label: 'Shockwave rings', def: false });
def('effects.confetti', { type: 'toggle', group: 'Clears', label: 'Confetti', def: true });
def('effects.cutscene', { type: 'toggle', group: 'Stages', label: 'Stage cutscene', def: true, help: 'Plays the X1, X2 scene when the colors change. The bonus is paid either way.' });
def('effects.lights', { type: 'toggle', group: 'Stages', label: 'Light bulbs around the board', def: true });
def('sound.on', { type: 'toggle', group: 'Sound', label: 'Sound', def: true });
def('sound.sfx', { type: 'slider', group: 'Sound', label: 'Effects volume', def: 0.9, min: 0, max: 1, step: 0.01 });
def('sound.music', { type: 'slider', group: 'Music', label: 'Music volume', def: 0, min: 0, max: 1, step: 0.01 });
def('sound.tempo', { type: 'slider', group: 'Music', label: 'Music tempo', def: 92, min: 60, max: 140, step: 1, unit: 'bpm' });
def('sound.musicStyle', { type: 'select', group: 'Music', label: 'Music style', def: 'dreamy', options: [{ v: 'dreamy', label: 'Dreamy' }, { v: 'bouncy', label: 'Bouncy' }, { v: 'lofi', label: 'Lo-fi' }] });
def('sound.comboPitch', { type: 'toggle', group: 'Sound', label: 'Clears rise in pitch with the combo', def: true });
def('sound.haptics', { type: 'toggle', group: 'Haptics', label: 'Vibration', def: true });
def('sound.hapticStrength', { type: 'slider', group: 'Haptics', label: 'Vibration strength', def: 1, min: 0.2, max: 3, step: 0.1, unit: 'x' });
def('controls.trayScale', { type: 'slider', group: 'Tray', label: 'Tray piece size', def: 1, min: 0.6, max: 1.5, step: 0.05, unit: 'x' });
def('controls.trayTouch', { type: 'slider', group: 'Tray', label: 'Tray touch area', def: 1, min: 0.6, max: 2, step: 0.05, unit: 'x', help: 'How far above the tray a touch still grabs a piece.' });
def('access.bigText', { type: 'toggle', group: 'Text', label: 'Bigger text', def: false });
def('access.reducedMotion', { type: 'toggle', group: 'Motion', label: 'Reduce motion', def: false, help: 'No shake, flash, confetti or idle animation.' });
const RM = () => opt('access.reducedMotion', false);
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeBack = k => { k = clamp(k, 0, 1); const s = 1.9; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };

// ---------- clock: animation speed and pause ----------
let vt = performance.now(), lastReal = vt, paused = false;
const clock = () => vt;
function tick(real){
  const dt = Math.min(250, real - lastReal); lastReal = real;
  if (!paused) vt += dt * opt('effects.speed', 1);
  return vt;
}
const P = n => Math.round(n * Q.part * (RM() ? Math.min(1, opt('effects.particles', 1)) * 0.5 : opt('effects.particles', 1)));

// ---------- performance ----------
// Quality levels: 0 high, 1 medium, 2 low. 'auto' starts from the level this phone settled on last time
// and steps down when frames are slow (median frame time over ~1.5 s of animation above 26 ms).
// The game also stops redrawing entirely while nothing on screen moves.
def('effects.quality', { type: 'select', group: 'Performance', label: 'Graphics quality', def: 'auto', options: [{ v: 'auto', label: 'Auto (adapts to the phone)' }, { v: 'high', label: 'High' }, { v: 'medium', label: 'Medium' }, { v: 'low', label: 'Low (old phones)' }], help: 'Low draws at a lower resolution with fewer particles and no glow. Auto lowers it by itself when the game stutters.' });
def('effects.maxFps', { type: 'select', group: 'Performance', label: 'Frame rate limit', def: '0', options: [{ v: '0', label: 'No limit' }, { v: '60', label: '60 fps' }, { v: '30', label: '30 fps (saves battery)' }] });
def('effects.sleep', { type: 'toggle', group: 'Performance', label: 'Pause drawing when nothing moves', def: true, help: 'Saves battery. Turn off only if something looks frozen.' });
def('effects.fpsMeter', { type: 'toggle', group: 'Performance', label: 'Show frame rate', def: false });
def('effects.retest', { type: 'button', group: 'Performance', label: 'Re-test phone speed', help: 'Forgets the quality Auto picked and measures again.', action: () => { store.del(QKEY); autoLevel = 0; applyQuality(); } });
const QKEY = 'gridburst-perf-v1';
let autoLevel = 0; try { autoLevel = clamp(+(localStorage.getItem(QKEY) || 0) | 0, 0, 2); } catch {}
const Q = { level: 0, part: 1, glow: true, scale: 2 };
function applyQuality(){
  const m = opt('effects.quality', 'auto');
  const lv = m === 'high' ? 0 : m === 'medium' ? 1 : m === 'low' ? 2 : autoLevel;
  const dev = window.devicePixelRatio || 1;
  Q.level = lv;
  Q.scale = lv === 0 ? Math.min(dev, m === 'high' ? 3 : 2) : lv === 1 ? Math.min(dev, 1.5) : 1;
  Q.part = [1, 0.6, 0.3][lv];
  Q.glow = lv === 0;
  document.body.classList.toggle('gb-low', lv === 2);
  perf.samples.length = 0; perf.skipUntil = performance.now() + 2000;
  if (L.W) layout();
}
const perf = { samples: [], skipUntil: 0, lastReal: 0, drew: false, frames: 0, t0: 0, fps: 0, el: null };
// called for every frame that actually drew, with the real time since the previous drawn frame
function perfSample(dt, real){
  perf.frames++;
  if (real - perf.t0 >= 500){ perf.fps = Math.round(perf.frames * 1000 / (real - perf.t0)); perf.frames = 0; perf.t0 = real; showFps(); }
  if (opt('effects.quality', 'auto') !== 'auto' || +opt('effects.maxFps', '0') || autoLevel >= 2 || real < perf.skipUntil || dt > 120 || document.hidden) return;
  perf.samples.push(dt);
  if (perf.samples.length < 90) return;
  const a = perf.samples.slice().sort((x, y) => x - y), med = a[a.length >> 1];
  perf.samples.length = 0;
  if (med > 26){ autoLevel++; store.set(QKEY, String(autoLevel)); applyQuality(); }
}
function showFps(){
  const on = opt('effects.fpsMeter', false);
  if (!on){ if (perf.el){ perf.el.remove(); perf.el = null; } return; }
  if (!perf.el){ perf.el = document.createElement('div'); perf.el.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:2000;font:600 11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;pointer-events:none'; document.body.appendChild(perf.el); }
  perf.el.textContent = (perf.drew ? perf.fps + ' fps' : 'idle') + ' · ' + ['high', 'medium', 'low'][Q.level] + ' · ' + Q.scale + 'x';
}
setInterval(() => { if (!perf.drew){ perf.fps = 0; } showFps(); perf.drew = false; }, 1000);

// ---------- grid logic ----------
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(-1));
function canPlace(g, p, r, c){
  for (const [dr, dc] of p.cells){
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || g[rr][cc] >= 0) return false;
  }
  return true;
}
function fullLines(g){
  const rows = [], cols = [];
  for (let i = 0; i < N; i++){
    if (g[i].every(v => v >= 0)) rows.push(i);
    let f = true; for (let r = 0; r < N; r++) if (g[r][i] < 0){ f = false; break; }
    if (f) cols.push(i);
  }
  return { rows, cols };
}
function firstFit(g, p){
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(g, p, r, c)) return [r, c];
  return null;
}
const rseed = () => (Math.random() * 2147483647) | 0;
const cellSeed = (ps, r, c) => { let h = (ps ^ (r * 73856093) ^ (c * 19349663)) >>> 0; h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; return (h ^ (h >>> 13)) >>> 0; };
function newSet(){
  const col = shuffledColors();
  return GBPieces.newSet(grid, pm, { score, best, chain: sc.chain | 0, quiet: sc.quiet | 0, placed: sc.placed | 0 }).map((p, i) => ({ ...p, color: col[i], seed: rseed() }));
}
function shuffledColors(){ const a = []; for (let i = 0; i < PIECE_COLORS; i++) a.push(i); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Start board: a scattered three-colour checker, roughly 60% full, with no complete row or column.
const START_PALETTES = [[2, 3, 4], [2, 3, 4], [0, 1, 3], [7, 4, 2], [6, 4, 3]];
function prefillGrid(){
  const pal = START_PALETTES[Math.random() * START_PALETTES.length | 0];
  const g = emptyGrid();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if (Math.random() < ((r + c) % 2 === 0 ? 0.8 : 0.36)) g[r][c] = pal[Math.random() * 3 | 0];
  const { rows, cols } = fullLines(g);
  rows.forEach(r => { g[r][Math.random() * N | 0] = -1; });
  cols.forEach(c => { if (g.every(row => row[c] >= 0)) g[Math.random() * N | 0][c] = -1; });
  return g;
}
const seedGrid = () => Array.from({ length: N }, () => Array.from({ length: N }, rseed));

// ---------- state ----------
const KEY = 'gridburst-state-v1', BKEY = 'gridburst-best', MKEY = 'gridburst-muted';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
let grid = emptyGrid(), seeds = seedGrid(), tray = [], score = 0, dispScore = 0, over = false;
let sc = GBScore.init(), pm = GBPieces.init();   // scoring state and piece-picker memory, both saved
let intro = false;   // teal multicolour opening, until INTRO_END points
let best = +store.get(BKEY) || 0;
if (store.get(MKEY) === '1' && GS){ GS.set('sound.on', false); store.del(MKEY); }
let bestAtStart = best;
const INTRO_END = 1500;
// lifetime stats plus this game's, both shown on the Stats page
const SKEY = 'gridburst-stats-v1';
let life = {}; try { life = JSON.parse(store.get(SKEY) || '{}') || {}; } catch { life = {}; }
const newGameStats = () => ({ lines: 0, placed: 0, maxChain: 0, maxLines: 0, t: 0 });
let gstat = newGameStats(), counted = false;
function addStat(k, v){ if (!opt('gameplay.stats', true)) return; life[k] = (life[k] || 0) + v; store.set(SKEY, JSON.stringify(life)); }
function maxStat(k, v){ if (!opt('gameplay.stats', true)) return; if (!(life[k] >= v)){ life[k] = v; store.set(SKEY, JSON.stringify(life)); } }

function save(){ store.set(KEY, JSON.stringify({ grid, seeds, tray, score, sc, pm, intro, stats: gstat })); }
function load(){
  try {
    const s = JSON.parse(store.get(KEY));
    if (s && Array.isArray(s.grid) && s.grid.length === N && Array.isArray(s.tray)){
      grid = s.grid; tray = s.tray; score = s.score | 0; dispScore = score; sc = s.sc && typeof s.sc === 'object' ? s.sc : GBScore.init(); pm = s.pm && typeof s.pm === 'object' ? s.pm : GBPieces.init();
      intro = s.intro === true && score < INTRO_END;
      seeds = Array.isArray(s.seeds) && s.seeds.length === N ? s.seeds : seedGrid();
      tray = tray.map(q => q && (q.seed === undefined ? { ...q, seed: rseed() } : q));
      gstat = s.stats && typeof s.stats === 'object' ? s.stats : newGameStats();
      if (tray.every(p => !p)) tray = newSet();
      return true;
    }
  } catch {}
  return false;
}
function reset(){
  const now = clock();
  score = 0; dispScore = 0; over = false; sc = GBScore.init(); comboCol = null; intro = opt('gameplay.intro', true); cut = null;
  bestAtStart = best; seeds = seedGrid(); gstat = newGameStats(); counted = false;
  const fill = opt('gameplay.prefill', true);
  for (let k = 0; k < 8; k++){
    grid = fill ? prefillGrid() : emptyGrid(); pm = GBPieces.init(); tray = newSet();
    if (tray.some(q => q && firstFit(grid, q))) break;
    if (k === 7){ grid = emptyGrid(); pm = GBPieces.init(); tray = newSet(); }
  }
  applyTheme(0, true);
  clears.length = 0; popups.length = 0; parts.length = 0; beams.length = 0; sparks.length = 0; rings.length = 0;
  banners.length = 0; gems.length = 0; confetti.length = 0; placed.length = 0; fly = null;
  // the board shows full of random colours, then the extra cells vanish leaving the start pattern
  startFill = { t0: now, cells: [] };
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] < 0) startFill.cells.push({ r, c, col: Math.random() * PIECE_COLORS | 0, t: 800 + Math.random() * 200 });
  overFill = null; countHold = 0; cRun = null;
  spawnT = now + 1350;
  $('#over').classList.remove('show');
  updateHud(true); save();
  addStat('Games started', 1);
}

// ---------- layout ----------
let L = {}, dpr = 1;
function layout(){
  dpr = Q.scale || Math.min(window.devicePixelRatio || 1, 2);
  if (window.GBSkins && GBSkins.setScale) GBSkins.setScale(dpr);
  const hdr = $('header').getBoundingClientRect();
  const padB = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  const W = Math.min(window.innerWidth, 520);
  const availH = window.innerHeight - hdr.bottom - padB - 6;
  const b = Math.floor(Math.max(200, Math.min(W - 26, (availH - 24) / 1.4)));
  const cell = b / N;
  const ty = 14 + b + cell * 0.5, th = cell * 2.8;
  const H = Math.ceil(ty + th + 8);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const tc = Math.min(cell * 0.5, (W / 3 - 14) / 5, th / 5.2) * opt('controls.trayScale', 1);
  L = { W, H, b, cell, bx: (W - b) / 2, by: 14, ty, th, tc };
  sprites.clear(); wake();
  ov.width = Math.round(window.innerWidth * dpr); ov.height = Math.round(window.innerHeight * dpr);
  const cr = cv.getBoundingClientRect(); ovX = cr.left; ovY = cr.top; ovUsed = true; ovBox = null;
  const sr = $('#score').getBoundingClientRect(); L.sx = sr.left + sr.width / 2 - cr.left; L.sy = sr.top + sr.height / 2 - cr.top;
  document.body.classList.toggle('lefty', !!opt('gameplay.leftHanded', false));
  document.body.classList.toggle('bigtext', !!opt('access.bigText', false));
}

  { bg: ['#ffd3e6', '#f9b3d2', '#ee93bf'], frame: '#ffc7df', well: '#6b2b55', line: 'rgba(255,170,220,.13)',    skin: 9,  num: ['#ffffff', '#ffc2ea', '#ff5fc8'], ink: '#7a2462', glow: 0.6 },
  { bg: ['#55e8b0', '#2fd093', '#15a572'], frame: '#a8ffd9', well: '#0e4a3b', line: 'rgba(140,255,210,.12)',    skin: 10, num: ['#f0fff8', '#7dffc8', '#14c08c'], ink: '#0a5240', lights: true, glow: 0.25 },
  { bg: ['#b49cff', '#8c6cf2', '#6243cf'], frame: '#c6b2ff', well: '#24125a', line: 'rgba(190,160,255,.14)',    skin: 11, num: GOLD, ink: '#2e1a78' },
  { bg: ['#ffc27a', '#ff9a55', '#ea6a3c'], frame: '#ffd29a', well: '#5a1f1a', line: 'rgba(255,190,140,.13)',    skin: 12, num: ['#ffffff', '#fff27a', '#ffb000'], ink: '#7a2e12', lights: true },

const BAR_COLS = [0, 1, 2, 3, 4, 5, 6, 7];
const stageOf = s => typeof GBScore.stageOf === 'function' ? GBScore.stageOf(s) | 0 : (s < 28000 ? 0 : 1 + Math.floor((s - 28000) / 3500));
function themeFor(s){
  const f = opt('gameplay.theme', 'auto');
  if (f !== 'auto') return clamp(+f | 0, 0, THEMES.length - 1);
  if (intro) return 0;
  if (!opt('scoring.stages', true)) return 1;
  const st = stageOf(s);
  return st <= 0 ? 1 : 2 + (st - 1) % (THEMES.length - 2);
}
let themeIdx = 0, themePrev = 0, themeT0 = -1e9;
function mixHex(a, b, t){
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const ch = sh => Math.round((x >> sh & 255) + ((y >> sh & 255) - (x >> sh & 255)) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function applyTheme(i, instant){
  if (i === themeIdx && !instant) return;
  const now = clock(); wake();
  themePrev = instant ? i : themeIdx; themeIdx = i; themeT0 = instant ? -1e9 : now;
  const t = THEMES[i], st = document.documentElement.style;
  if (instant){ st.transition = 'none'; requestAnimationFrame(() => requestAnimationFrame(() => { st.transition = ''; })); }
  st.setProperty('--bg1', t.bg[0]); st.setProperty('--bg2', t.bg[1]); st.setProperty('--bg3', t.bg[2]);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t.bg[1];
  // blocks flip to the new skin in a diagonal wave, each with a little pop
  if (!instant && THEMES[themePrev].skin !== t.skin)
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] >= 0) placed.push({ r, c, t0: now + (r + c) * 40 });
}
// what a stored block colour looks like on screen right now
const skinNow = v => THEMES[themeIdx].skin >= 0 ? THEMES[themeIdx].skin : v;
function skinAt(v, r, c, now){
  const t = now - themeT0 >= (r + c) * 40 ? THEMES[themeIdx] : THEMES[themePrev];
  return t.skin >= 0 ? t.skin : v;
}

// ---------- block sprites ----------
const sprites = new Map();
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function poly(c, pts, fill){ c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fillStyle = fill; c.fill(); }
// Glossy bevelled block: dark rim, lit top bevel, darker bottom bevel, a flat face and a soft shine.
function sprite(col, size){
  const key = col + '@' + Math.round(size * 10);
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(4, Math.round(size * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), hex = COLORS[col];
  const m = px * 0.03, w = px - 2 * m, r = px * 0.09;
  rr(c, m, m, w, w, r); c.fillStyle = shade(hex, -0.5); c.fill();
  const a = m + px * 0.03, b = px - a, bv = px * 0.15;
  c.save(); rr(c, a, a, b - a, b - a, r * 0.7); c.clip();
  poly(c, [a, a, b, a, b - bv, a + bv, a + bv, a + bv], shade(hex, 0.55));
  poly(c, [a, a, a + bv, a + bv, a + bv, b - bv, a, b], shade(hex, 0.25));
  poly(c, [b, a, b, b, b - bv, b - bv, b - bv, a + bv], shade(hex, -0.14));
  poly(c, [a, b, b, b, b - bv, b - bv, a + bv, b - bv], shade(hex, -0.34));
  c.restore();
  const f0 = a + bv, fw = b - bv - f0;
  const grad = c.createLinearGradient(0, f0, 0, f0 + fw);
  grad.addColorStop(0, shade(hex, 0.14)); grad.addColorStop(1, shade(hex, -0.06));
  rr(c, f0, f0, fw, fw, px * 0.035); c.fillStyle = grad; c.fill();
  const pat = PATTERN[col];
  if (pat){
    c.save(); rr(c, f0, f0, fw, fw, px * 0.035); c.clip();
    if (pat === 'gingham'){
      c.fillStyle = 'rgba(255,255,255,.32)';
      for (let k = 0; k < 3; k++){ c.fillRect(f0, f0 + fw * (k / 3 + 0.08), fw, fw / 6); c.fillRect(f0 + fw * (k / 3 + 0.08), f0, fw / 6, fw); }
      c.fillStyle = 'rgba(200,40,120,.16)';
      for (let k = 0; k < 3; k++) for (let q = 0; q < 3; q++) c.fillRect(f0 + fw * (k / 3 + 0.25), f0 + fw * (q / 3 + 0.25), fw / 12, fw / 12);
    } else {
      const dots = [[0.22, 0.3, '#ff8fb3'], [0.7, 0.24, '#ffc94d'], [0.5, 0.62, '#7fd2ff'], [0.2, 0.78, '#9be86a'], [0.8, 0.76, '#ff8fb3']];
      for (const [dx, dy, dc] of dots){ c.fillStyle = dc; c.beginPath(); c.arc(f0 + fw * dx, f0 + fw * dy, fw * 0.075, 0, Math.PI * 2); c.fill(); }
    }
    c.restore();
  }
  c.globalAlpha = 0.38; c.fillStyle = '#fff';
  rr(c, f0 + fw * 0.08, f0 + fw * 0.08, fw * 0.6, fw * 0.16, fw * 0.08); c.fill();
  c.globalAlpha = 1;
  sprites.set(key, s); return s;
}
function glowSprite(col, size){
  const key = 'glow' + col + '@' + Math.round(size * 10);
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(8, Math.round(size * 2 * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), g = c.createRadialGradient(px / 2, px / 2, px * 0.12, px / 2, px / 2, px / 2);
  g.addColorStop(0, shade(COLORS[col], 0.55)); g.addColorStop(0.45, COLORS[col]); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = 0.55; c.fillStyle = g; c.fillRect(0, 0, px, px);
  sprites.set(key, s); return s;
}
// soft round light, for the bulb frame and the gems
function lightSprite(size, color){
  const key = 'light' + color + '@' + Math.round(size * 10);
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(6, Math.round(size * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), g = c.createRadialGradient(px / 2, px / 2, 0, px / 2, px / 2, px / 2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, px, px);
  sprites.set(key, s); return s;
}
// seed: per-block number (stable for a placed block), ps: the piece it came from
function block(col, x, y, s, a = 1, sc = 1, seed = 0, ps = 0){
  if (window.GBSkins && GBSkins.draw){
    const skin = GBSkins.skinFor ? GBSkins.skinFor({ stage: themeIdx, pieceSeed: ps, cellSeed: seed, themeSkin: THEMES[themeIdx].skin }) : 'classic';
    if (!RM() && GBSkins.anim){ const m = GBSkins.anim(seed, vt, 'idle'); if (m && m.scale) sc *= m.scale; }
    GBSkins.draw(ctx, x, y, s, { hex: COLORS[col], skin, pattern: PATTERN[col] || '', t: vt, seed, alpha: a, scale: sc });
    return;
  }
  const img = sprite(col, s);
  ctx.globalAlpha = a;
  if (sc !== 1){ const d = s * sc; ctx.drawImage(img, x + (s - d) / 2, y + (s - d) / 2, d, d); }
  else ctx.drawImage(img, x, y, s, s);
  ctx.globalAlpha = 1;
}

// ---------- audio / haptics ----------
let AC = null, OUT = null, MUS = null, NOISE = null;
function audioInit(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      OUT = AC.createGain(); OUT.gain.value = opt('sound.sfx', 0.9); OUT.connect(comp).connect(AC.destination);
      MUS = AC.createGain(); MUS.gain.value = 0; MUS.connect(comp);
      NOISE = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
// One enveloped oscillator; f2 slides the pitch over the note.
function tone(f, d, type = 'sine', v = 0.12, when = 0, f2 = 0){
  if (!AC || !opt('sound.on', true)) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(OUT); o.start(t); o.stop(t + d + 0.02);
}
// Filtered noise burst for clicks, thuds and whooshes; f2 sweeps the filter.
function noise(f, d, v = 0.1, when = 0, f2 = 0, q = 1.2){
  if (!AC || !opt('sound.on', true)) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(f, t);
  if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(bp).connect(g).connect(OUT); s.start(t); s.stop(t + d + 0.02);
}
const bell = (f, v, when) => { tone(f, 0.35, 'sine', v, when); tone(f * 2.01, 0.18, 'sine', v * 0.35, when); tone(f * 3.98, 0.08, 'triangle', v * 0.15, when); };
const semi = s => Math.pow(2, s / 12);
const sfx = {
  pick(){ tone(520, 0.07, 'sine', 0.08, 0, 820); noise(3000, 0.03, 0.04); },
  place(){ tone(150, 0.12, 'sine', 0.16, 0, 70); noise(900, 0.06, 0.12, 0, 300, 0.8); tone(420, 0.05, 'triangle', 0.04, 0.005); },
  clear(n, st){
    const base = 440 * (opt('sound.comboPitch', true) ? semi(Math.min(st - 1, 9) * 2) : 1);
    noise(400, 0.35, 0.09, 0, 6000, 0.7);
    const steps = [0, 4, 7, 12, 16, 19, 24, 28];
    for (let k = 0; k < Math.min(n + 3, steps.length); k++) bell(base * semi(steps[k]), 0.09, k * 0.05);
    if (n >= 3 || st >= 4){
      tone(70, 0.5, 'sine', 0.25, 0, 40);
      [0, 4, 7, 11].forEach(s => tone(base * semi(s) / 2, 0.6, 'triangle', 0.05, 0.12));
    }
  },
  boardClear(){ [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => bell(523 * semi(s), 0.1, 0.25 + k * 0.07)); },
  legend(){ [0, 5, 9, 12, 17].forEach((s, k) => bell(587 * semi(s), 0.08, 0.15 + k * 0.06)); tone(196, 0.5, 'triangle', 0.06, 0.15); },
  master(){
    tone(60, 0.6, 'sine', 0.25, 0, 35); noise(500, 0.5, 0.1, 0, 7000, 0.6);
    [0, 4, 7, 12].forEach((s, k) => tone(392 * semi(s), 0.22, 'square', 0.03, 0.12 + k * 0.08));
    [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => bell(523 * semi(s), 0.09, 0.45 + k * 0.05));
  },
  stage(){
    for (let k = 0; k < 8; k++) noise(220, 0.07, 0.05 + k * 0.01, k * 0.07, 0, 0.9);
    tone(80, 0.7, 'sine', 0.22, 0.6, 45);
    [0, 4, 7, 12].forEach((s, k) => tone(392 * semi(s), 0.25, 'square', 0.035, 0.62 + k * 0.1));
    [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => bell(523 * semi(s), 0.09, 0.75 + k * 0.07));
  },
  bad(){ tone(220, 0.16, 'triangle', 0.08, 0, 120); noise(500, 0.08, 0.05); },
  fly(){ tone(700, 0.12, 'sine', 0.05, 0, 380); },
  over(){ [523, 440, 349, 262].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, i * 0.16, f * 0.94)); tone(110, 0.8, 'sine', 0.12, 0.6, 55); },
};
function buzz(p){

  const k = opt('sound.hapticStrength', 1), q = Array.isArray(p) ? p.map((v, i) => i % 2 ? v : Math.round(v * k)) : Math.round(p * k);
  try { if (navigator.vibrate) navigator.vibrate(q); } catch {}
}
// Background music: a soft generated loop (pad chord + arpeggio), scheduled a bar ahead.
const CHORDS = [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]];
let musBar = 0, musNext = 0;
function musicNote(f, d, type, v, when){
  if (!AC || !MUS) return;

  for (let i = sparks.length - 1; i >= 0; i--){
    const q = sparks[i], t = now - q.t0;
    if (t > q.life){ sparks.splice(i, 1); continue; }
    if (t < 0) continue;
    const k = t / q.life;
    ctx.globalAlpha = 1 - k; star(ctx, q.x, q.y - k * cell * 0.4, q.s * Math.sin(Math.min(1, k * 2.5) * Math.PI / 2));
  }
  ctx.globalAlpha = 1;
  // shockwave rings and screen flash for big combos
  for (let i = rings.length - 1; i >= 0; i--){
    const q = rings[i], k = (now - q.t0) / 600;
    if (k > 1){ rings.splice(i, 1); continue; }
    if (k < 0) continue;
    ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = cell * 0.35 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(q.x, q.y, cell * 0.5 + k * b * 0.75, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const fk = (now - flashT) / 380;
  const fm = RM() ? 0 : opt('effects.flash', 1);
  if (fk >= 0 && fk < 1 && fm > 0){ ctx.fillStyle = `rgba(255,255,255,${Math.min(0.9, flashA * fm) * (1 - fk)})`; rr(ctx, bx - fr, by - fr, b + 2 * fr, b + 2 * fr, 10); ctx.fill(); }

  // new game: the extra cells of a full board vanish
  if (startFill){
    const k = now - startFill.t0;
    if (k > 1100) startFill = null;
    else for (const q of startFill.cells){
      const v = (k - q.t) / 120; if (v >= 1) continue;
      block(q.col, bx + q.c * cell, by + q.r * cell, cell, 1, v > 0 ? 1 - easeOut(v) : 1, cellSeed(q.r * 9 + q.c, q.r, q.c), q.r * 9 + q.c);
    }
  }
  // No Space Left: the board fills up block by block
  if (over && overFill && now > overT){
    const k = now - overT;
    for (const q of overFill){ const v = (k - q.t) / 140; if (v > 0) block(q.col, bx + q.c * cell, by + q.r * cell, cell, 1, easeBack(v), cellSeed(q.r * 9 + q.c, q.r, q.c), q.r * 9 + q.c); }
  }
  // tray
  const slotW = W / 3, tyc = L.ty + L.th / 2;
  const noSpace = over && overFill && now > overT;
  if (noSpace){
    const k = easeBack((now - overT) / 300), bw = Math.min(W - 24, b * 1.02), bh = cell * 1.1;
    ctx.save(); ctx.translate(W / 2, tyc); ctx.scale(Math.max(0.01, k), Math.max(0.01, k));
    ctx.fillStyle = 'rgba(10,14,50,.35)'; rr(ctx, -bw / 2, -bh / 2 + 4, bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; rr(ctx, -bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    fancyText('No Space Left', 0, 0, bh * 0.5, ['#ff8fa8', '#ff3d6a', '#e0164a'], 'rgba(255,255,255,0)');
    ctx.restore();
  }
  for (let i = 0; i < 3; i++){
    const q = tray[i]; if (noSpace || !q || (drag && drag.i === i) || (fly && fly.i === i)) continue;
    const fits = trayFits(h)[i];
    const ease = 1 - Math.pow(1 - clamp((now - spawnT - i * 75) / 130, 0, 1), 3);
    if (ease <= 0) continue;
    const tc = L.tc * (0.4 + 0.6 * ease);
    const ox = (i + 0.5) * slotW - q.w * tc / 2, oy = tyc - q.h * tc / 2;
    const dim = fits || !opt('gameplay.dimTray', true) ? ease : 0.3 * ease;
    for (const [dr, dc] of q.cells) block(skinNow(q.color), ox + dc * tc, oy + dr * tc, tc, dim, 1, cellSeed(q.seed | 0, dr, dc), q.seed | 0);
  }
  // dragged piece and fly-back go on the overlay
  const ptsFly = popups.some(q => q.kind === 'pts' && now >= q.t0);
  if (drag || fly || ovUsed || ptsFly){
    ovCtx.setTransform(dpr, 0, 0, dpr, ovX * dpr, ovY * dpr);
    if (ovBox && !ovFull) ovCtx.clearRect(ovBox[0] - 2, ovBox[1] - 2, ovBox[2] + 4, ovBox[3] + 4);
    else { ovCtx.setTransform(1, 0, 0, 1, 0, 0); ovCtx.clearRect(0, 0, ov.width, ov.height); }
    ovBox = null; ovFull = false; ovUsed = !!(drag || fly || ptsFly);
    const disp = ovUsed ? '' : 'none'; if (ov.style.display !== disp) ov.style.display = disp;
    ovCtx.setTransform(dpr, 0, 0, dpr, ovX * dpr, ovY * dpr);
  }
  ctx = ovCtx;
  if (fly){
    const q = tray[fly.i], k0 = (now - fly.t0) / 230;
    if (!q || k0 >= 1) fly = null;
    else {
      const k = 1 - Math.pow(1 - k0, 3), sz = fly.sz + (L.tc - fly.sz) * k;
      const cx = fly.cx + ((fly.i + 0.5) * slotW - fly.cx) * k, cy = fly.cy + (tyc - fly.cy) * k;
      for (const [dr, dc] of q.cells) block(skinNow(q.color), cx - q.w * sz / 2 + dc * sz, cy - q.h * sz / 2 + dr * sz, sz, 1, 1, cellSeed(q.seed | 0, dr, dc), q.seed | 0);
      ovBox = [cx - q.w * sz / 2, cy - q.h * sz / 2, q.w * sz, q.h * sz];
    }
  }
  // dragged piece: grows from tray size to board size as it lifts toward the finger
  if (drag && p){
    const gr = opt('controls.grow', 140), k0 = gr > 0 ? Math.min(1, (now - drag.t0) / gr) : 1, k = 1 - Math.pow(1 - k0, 3);
    const sz = L.tc + ((s.size || cell) - L.tc) * k;
    const tcx = (drag.i + 0.5) * slotW, tcy = tyc;
    const cx = tcx + (s.left + p.w * cell / 2 - tcx) * k, cy = tcy + (s.top + p.h * cell / 2 - tcy) * k;
    const ox = cx - p.w * sz / 2, oy = cy - p.h * sz / 2;
    drag.cx = cx; drag.cy = cy; drag.sz = sz;
    const bx2 = ox + p.w * sz + sz * 0.2, by2 = oy + p.h * sz + sz * 0.3;
    if (ovBox){ const x1 = Math.min(ovBox[0], ox), y1 = Math.min(ovBox[1], oy); ovBox = [x1, y1, Math.max(ovBox[0] + ovBox[2], bx2) - x1, Math.max(ovBox[1] + ovBox[3], by2) - y1]; }
    else ovBox = [ox, oy, bx2 - ox, by2 - oy];
    ctx.fillStyle = 'rgba(4,8,40,.3)';
    for (const [dr, dc] of p.cells){ rr(ctx, ox + dc * sz + sz * 0.08, oy + dr * sz + sz * 0.2, sz * 0.92, sz * 0.92, sz * 0.1); ctx.fill(); }
    for (const [dr, dc] of p.cells) block(pcol, ox + dc * sz, oy + dr * sz, sz, 1, 1, cellSeed(p.seed | 0, dr, dc), p.seed | 0);
  }

  ctx = mainCtx;
  // confetti
  for (let i = confetti.length - 1; i >= 0; i--){
    const q = confetti[i], t = now - q.t0;
    if (t > q.life){ confetti.splice(i, 1); continue; }
    if (t < 0) continue;
    q.x += q.vx + Math.sin(t / 200 + i) * 0.6; q.y += q.vy; q.vy = Math.min(q.vy + 0.05, 3.2); q.rot += q.vr;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(1, Math.cos(t / 120 + i));
    ctx.globalAlpha = Math.min(1, (q.life - t) / 400); ctx.fillStyle = q.col;
    if (q.tri){ ctx.beginPath(); ctx.moveTo(-q.w, q.w * 0.7); ctx.lineTo(q.w, q.w * 0.7); ctx.lineTo(0, -q.w); ctx.closePath(); ctx.fill(); }
    else ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // popups
  const T = THEMES[themeIdx];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (let i = popups.length - 1; i >= 0; i--){
    const q = popups[i], dur = q.kind === 'pts' ? 340 : q.kind === 'combo' ? 700 : q.kind === 'perfect' ? 750 : q.big ? 1250 : 900, k = (now - q.t0) / dur;
    if (k > 1){ popups.splice(i, 1); continue; }
    if (k < 0) continue;
    if (q.kind === 'pts'){
      // pops in at the cleared lines, holds, then flies into the score (on the overlay: it leaves the canvas)
      const f = clamp((k - 0.68) / 0.32, 0, 1), e = f * f;
      const x = q.x + ((L.sx || W / 2) - q.x) * e, y = q.y + ((L.sy || -cell) - q.y) * e;
      const sc2 = (k < 0.12 ? 0.3 + k / 0.12 * 0.95 : k < 0.24 ? 1.25 - (k - 0.12) / 0.12 * 0.25 : 1) * (1 - e * 0.45);
      const keep = ctx; ctx = ovCtx; ovFull = true;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.globalAlpha = f > 0.85 ? (1 - f) / 0.15 : 1;
      fancyText(q.text, x, y, q.size * sc2, '#fff', 'rgba(20,14,60,.8)');
      ctx.globalAlpha = 1; ctx = keep;
      continue;
    }
    const sc = k < 0.12 ? 0.3 + k / 0.12 * 0.95 : (k < 0.24 ? 1.25 - (k - 0.12) / 0.12 * 0.25 : 1);
    ctx.globalAlpha = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
    const fs = q.size * sc;
    if (q.kind === 'combo'){
      // "Combo" in white, the number big with a gradient and a glowing diamond behind it
      const m = /(\d+)$/.exec(q.text), num = m ? m[1] : '', word = 'Combo';
      const y = q.y - k * cell * 0.3, fw = fs * 0.78, fn = fs * 1.55;
      ctx.font = `700 ${fw}px ${FONT}`; const ww = ctx.measureText(word).width;
      ctx.font = `700 ${fn}px ${FONT}`; const wn = num ? ctx.measureText(num).width : 0;
      const gap = num ? fs * 0.18 : 0, x0 = q.x - (ww + gap + wn) / 2;
      if (num){
        const nx = x0 + ww + gap + wn / 2, d = fn * 0.85;
        ctx.save(); ctx.translate(nx, y); ctx.rotate(Math.PI / 4 + k * 0.6);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, d);
        g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(0.4, T.num[2] + '99'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(-d * 0.75, -d * 0.75, d * 1.5, d * 1.5);
        ctx.restore();
        fancyText(num, nx, y - fs * 0.08, fn, T.num, T.ink, 'rgba(255,255,255,.75)');
      }
      fancyText(word, x0 + ww / 2, y + (num ? fs * 0.12 : 0), fw, '#fff', T.ink, 'rgba(255,255,255,.6)');
    } else if (q.kind === 'perfect'){
      const y = q.y - k * cell * 0.4;
      ctx.save(); ctx.translate(q.x, y); ctx.rotate(-0.12);
      ctx.font = `700 ${fs}px ${FONT}`;
      ctx.lineWidth = fs * 0.34; ctx.strokeStyle = 'rgba(110,20,50,.85)'; ctx.strokeText(q.text, 0, fs * 0.06);
      ctx.lineWidth = fs * 0.2; ctx.strokeStyle = '#fff'; ctx.strokeText(q.text, 0, 0);
      const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#ff8fa8'); g.addColorStop(0.5, '#ff3d6a'); g.addColorStop(1, '#e0164a');
      ctx.fillStyle = g; ctx.fillText(q.text, 0, 0);
      ctx.restore();
    } else {
      const y = q.y - k * cell * (q.big ? 0.6 : 1.2);
      fancyText(q.text, q.x, y, fs, GRADS[q.color] || q.color, q.big ? T.ink : 'rgba(20,14,60,.8)');
    }
    ctx.globalAlpha = 1;
  }
  drawBanners(now);
  if (cut) drawCut(now);

  // score count-up
  // the counter runs once the points have landed, faster for bigger gains, then snaps to the total
  if (dispScore !== score && now >= countHold){
    if (!cRun || cRun.to !== score) cRun = { from: dispScore, to: score, t0: now, dur: Math.min(1200, 200 + Math.abs(score - dispScore) * 0.5) / opt('effects.countSpeed', 1) };
    const k = Math.min(1, (now - cRun.t0) / cRun.dur);
    dispScore = k >= 1 ? score : Math.round(cRun.from + (cRun.to - cRun.from) * k);
    $('#score').textContent = dispScore;
  }
  if (dispScore === score) cRun = null;
}

// ---------- API for the menu ----------
window.GBGame = {
  version: '2026-11-08c',
  hasSave: () => !over && (sc.placed | 0) > 0,
  continueGame(){ if (window.GBMenu && GBMenu.isOpen()) GBMenu.close(); },
  newGame(){ reset(); if (window.GBMenu && GBMenu.isOpen()) GBMenu.close(); },
  pause(on){ paused = !!on; if (on && drag) endDrag(null, true); if (!on) audioInit(); wake(); },
  best: () => best,
  stats(){
    const out = {};
    const gp = life['Games played'] | 0;
    out['Best score'] = best;
    out['Games played'] = gp;
    out['Average score'] = gp ? Math.round((life['Total score'] || 0) / gp) : 0;
    out['Total score'] = life['Total score'] | 0;
    for (const k of ['Lines cleared', 'Blocks placed', 'Longest combo', 'Most lines at once', 'Legendary Comebacks', 'Combo Masters', 'Highest stage', 'New bests', 'Games started']) out[k] = life[k] | 0;
    out['This game: score'] = score;
    out['This game: lines'] = gstat.lines;
    out['This game: best combo'] = Math.max(0, gstat.maxChain - 1);
    return out;
  },
  resetStats(){ life = {}; store.del(SKEY); },
};
// test hook for automated play-throughs, only with ?debug in the address
if (/[?&]debug(=|&|$)/.test(location.search)) GBGame.debug = { place: (i, r, c) => { if (tray[i] && canPlace(grid, tray[i], r, c)){ place(i, r, c); wake(); return true; } return false; },
  state: () => ({ grid, tray, score, over, sleeping, quality: Q.level, scale: dpr, ovBox, ovUsed, drag: !!drag, ctxIsMain: ctx === mainCtx, ovT: ovCtx.getTransform().toString() }), setScore: v => { score = dispScore = v; updateHud(true); } };

// ---------- boot ----------
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
document.addEventListener('visibilitychange', wake);
applyQuality();
layout();
if (load()){
  applyTheme(themeFor(score), true);
  updateHud(true);
  if (!tray.some(q => q && firstFit(grid, q))) reset();
} else reset();
requestAnimationFrame(frame);
if (window.GBMenu && opt('gameplay.menuOnStart', true)) GBMenu.open('main');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
