<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d34a6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gridburst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#2cc4b0}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#14908e}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#0a5560}
:root{--bg1:#2cc4b0;--bg2:#14908e;--bg3:#0a5560;transition:--bg1 1.5s,--bg2 1.5s,--bg3 1.5s;--txt:#fff;--gold:#ffcf2e;--font:"Fredoka","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color:var(--txt);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg3)}
body{background:radial-gradient(90% 45% at 50% 8%,rgba(120,170,255,.35),transparent 70%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{width:100%;max-width:520px;padding:10px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.best{font-size:22px;font-weight:700;color:var(--gold);display:flex;gap:7px;align-items:center;text-shadow:0 2px 0 rgba(10,20,80,.45)}
.best svg{width:30px;height:24px;filter:drop-shadow(0 2px 0 rgba(10,20,80,.45))}
.btns{display:flex;gap:8px}
button.icon{background:linear-gradient(#5b7fff,#3a58d6);border:0;color:#fff;width:44px;height:44px;border-radius:14px;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #22379a,inset 0 2px 0 rgba(255,255,255,.3)}
button.icon:active{transform:translateY(3px);box-shadow:0 1px 0 #22379a,inset 0 2px 0 rgba(255,255,255,.3)}
.score{font-size:64px;line-height:1;font-weight:700;text-align:center;letter-spacing:1px;margin-top:-4px;-webkit-text-stroke:2px rgba(16,26,100,.55);paint-order:stroke fill;text-shadow:0 5px 0 rgba(12,22,90,.55),0 0 24px rgba(140,190,255,.35);transition:transform .12s}
.score.bump{transform:scale(1.12)}
.streak{height:22px;text-align:center;font-size:17px;font-weight:700;color:#ffe066;opacity:0;transition:opacity .2s;text-shadow:0 2px 0 rgba(12,22,90,.6)}
.streak.on{opacity:1}
canvas{touch-action:none;display:block}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,40,.75);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);padding:16px}
#over.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{text-align:center;width:100%;max-width:340px;background:linear-gradient(#2a3fa8,#18236b);border-radius:24px;padding:28px 20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.18)}
.t1{font-size:26px;font-weight:900;margin-bottom:14px}
.lbl{font-size:14px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:1px}
.big{font-size:56px;font-weight:900;line-height:1.1;margin:2px 0 6px}
.nb{display:none;color:var(--gold);font-weight:900;font-size:18px;margin-bottom:6px}
.nb.on{display:block;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#again{margin-top:18px;width:100%;height:56px;border:0;border-radius:16px;font-size:20px;font-weight:900;color:#2b1600;background:linear-gradient(#ffe066,#ffb703);box-shadow:0 5px 0 #c77c00;cursor:pointer}
#again:active{transform:translateY(3px);box-shadow:0 2px 0 #c77c00}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="best"><svg viewBox="0 0 30 24" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset=".55" stop-color="#ffc21a"/><stop offset="1" stop-color="#e88a00"/></linearGradient></defs><path d="M3 20 1.5 6.5l7 5.5L15 2l6.5 10 7-5.5L27 20z" fill="url(#cg)" stroke="#a85a00" stroke-width="1.6" stroke-linejoin="round"/><rect x="3" y="19" width="24" height="3.6" rx="1.6" fill="#ffb300" stroke="#a85a00" stroke-width="1.4"/><circle cx="15" cy="13.5" r="2.2" fill="#ff4d6d"/></svg><span id="best">0</span></div>
    <div class="btns">
      <button class="icon" id="restart" aria-label="Restart">↻</button>
      <button class="icon" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <div class="score" id="score">0</div>
  <div class="streak" id="streak">Combo x2</div>
</header>
<canvas id="c"></canvas>
<div id="over" role="dialog" aria-modal="true">
  <div class="card">
    <div class="t1">Game Over</div>
    <div class="lbl">Score</div>
    <div class="big" id="oscore">0</div>
    <div class="nb" id="newbest">New best!</div>
    <div class="lbl">Best <span id="obest">0</span></div>
    <button id="again">Play again</button>
  </div>
</div>
<script src="pieces.js"></script>
<script src="scoring.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const N = 8;
const COLORS = ['#f23d3d','#ff8c1a','#ffc61a','#3fcf3a','#16c3ee','#3566f2','#9a4dff','#ff4fa8'];
const FONT = '"Fredoka","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

// ---------- grid logic ----------
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(-1));
function canPlace(g, p, r, c){
  for (const [dr, dc] of p.cells){
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || g[rr][cc] >= 0) return false;
  }
  return true;
}
function fullLines(g){
  const rows = [], cols = [];
  for (let i = 0; i < N; i++){
    if (g[i].every(v => v >= 0)) rows.push(i);
    let f = true; for (let r = 0; r < N; r++) if (g[r][i] < 0){ f = false; break; }
    if (f) cols.push(i);
  }
  return { rows, cols };
}
function firstFit(g, p){
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(g, p, r, c)) return [r, c];
  return null;
}
function newSet(){
  const col = shuffledColors();
  return GBPieces.newSet(grid, pm, { score, best }).map((p, i) => ({ ...p, color: col[i] }));
}
function shuffledColors(){ const a = COLORS.map((_, i) => i); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- state ----------
const KEY = 'gridburst-state-v1', BKEY = 'gridburst-best', MKEY = 'gridburst-muted';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
let grid = emptyGrid(), tray = [], score = 0, dispScore = 0, over = false;
let sc = GBScore.init(), pm = GBPieces.init();   // scoring state and piece-picker memory, both saved
let best = +store.get(BKEY) || 0;
let muted = store.get(MKEY) === '1';
let bestAtStart = best;

function save(){ store.set(KEY, JSON.stringify({ grid, tray, score, sc, pm })); }
function load(){
  try {
    const s = JSON.parse(store.get(KEY));
    if (s && Array.isArray(s.grid) && s.grid.length === N && Array.isArray(s.tray)){
      grid = s.grid; tray = s.tray; score = s.score | 0; dispScore = score; sc = s.sc && typeof s.sc === 'object' ? s.sc : GBScore.init(); pm = s.pm && typeof s.pm === 'object' ? s.pm : GBPieces.init();
      if (tray.every(p => !p)) tray = newSet();
      return true;
    }
  } catch {}
  return false;
}
function reset(){
  grid = emptyGrid(); score = 0; dispScore = 0; over = false; sc = GBScore.init(); pm = GBPieces.init(); comboCol = null; applyTheme(0);
  bestAtStart = best;
  tray = newSet(); spawnT = performance.now();
  clears.length = 0; popups.length = 0; parts.length = 0; beams.length = 0; sparks.length = 0; rings.length = 0; fly = null;
  $('#over').classList.remove('show');
  updateHud(true); save();
}

// ---------- layout ----------
let L = {}, dpr = 1;
function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const hdr = $('header').getBoundingClientRect();
  const padB = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  const W = Math.min(window.innerWidth, 520);
  const availH = window.innerHeight - hdr.bottom - padB - 6;
  const b = Math.floor(Math.max(200, Math.min(W - 28, (availH - 22) / 1.44)));
  const cell = b / N;
  const ty = 12 + b + cell * 0.45, th = cell * 3.0;
  const H = Math.ceil(ty + th + 8);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const tc = Math.min(cell * 0.56, (W / 3 - 14) / 5, th / 5.2);
  L = { W, H, b, cell, bx: (W - b) / 2, by: 12, ty, th, tc };
  sprites.clear();
}

// ---------- themes ----------
// The board and page colours move through these as the score climbs.
const THEMES = [
  { at: 0,     bg: ['#2cc4b0', '#14908e', '#0a5560'], frame: ['#8af2d8', '#33b5a0', '#1d7f74'], well: '#07363b', cell: ['#05282c', '#0d474c', '#115459'] },
  { at: 3000,  bg: ['#3d63e6', '#1d34a6', '#101d6b'], frame: ['#5576f0', '#2c46c4', '#1a2c92'], well: '#0a1250', cell: ['#0a1148', '#142070', '#18267c'] },
  { at: 12000, bg: ['#7b55f0', '#4a2bb0', '#211060'], frame: ['#a184ff', '#5b39d0', '#38209a'], well: '#16094a', cell: ['#110740', '#21116a', '#291578'] },
  { at: 28000, bg: ['#ff6fae', '#c23d8e', '#5a1656'], frame: ['#ffa3cf', '#d4509c', '#8f2672'], well: '#360936', cell: ['#2b072d', '#48104c', '#541458'] },
];
const themeFor = sc => { let i = 0; THEMES.forEach((t, k) => { if (sc >= t.at) i = k; }); return i; };
let themeIdx = 0, themePrev = 0, themeT0 = -1e9;
function mixHex(a, b, t){
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const ch = sh => Math.round((x >> sh & 255) + ((y >> sh & 255) - (x >> sh & 255)) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function applyTheme(i, instant){
  if (i === themeIdx && !instant) return;
  themePrev = instant ? i : themeIdx; themeIdx = i; themeT0 = instant ? -1e9 : performance.now();
  const t = THEMES[i], st = document.documentElement.style;
  st.setProperty('--bg1', t.bg[0]); st.setProperty('--bg2', t.bg[1]); st.setProperty('--bg3', t.bg[2]);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t.bg[1];
}

// ---------- block sprites ----------
const sprites = new Map();
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function poly(c, pts, fill){ c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fillStyle = fill; c.fill(); }
// Chunky bevelled block: dark rim, four lit/shaded bevel faces, a glossy centre face and a shine.
function sprite(col, size){
  const key = col + '@' + Math.round(size * 10);
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(4, Math.round(size * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), hex = COLORS[col];
  const m = px * 0.025, w = px - 2 * m, r = px * 0.13;
  rr(c, m, m, w, w, r); c.fillStyle = shade(hex, -0.55); c.fill();
  const a = m + px * 0.035, b = px - a, bv = px * 0.17;
  c.save(); rr(c, a, a, b - a, b - a, r * 0.75); c.clip();
  poly(c, [a, a, b, a, b - bv, a + bv, a + bv, a + bv], shade(hex, 0.5));
  poly(c, [a, a, a + bv, a + bv, a + bv, b - bv, a, b], shade(hex, 0.24));
  poly(c, [b, a, b, b, b - bv, b - bv, b - bv, a + bv], shade(hex, -0.2));
  poly(c, [a, b, b, b, b - bv, b - bv, a + bv, b - bv], shade(hex, -0.38));
  c.restore();
  const f0 = a + bv, fw = b - bv - f0;
  const grad = c.createLinearGradient(0, f0, 0, f0 + fw);
  grad.addColorStop(0, shade(hex, 0.2)); grad.addColorStop(1, shade(hex, -0.08));
  rr(c, f0, f0, fw, fw, px * 0.05); c.fillStyle = grad; c.fill();
  c.globalAlpha = 0.42; c.fillStyle = '#fff';
  rr(c, f0 + fw * 0.1, f0 + fw * 0.1, fw * 0.55, fw * 0.18, fw * 0.09); c.fill();
  c.globalAlpha = 0.85; c.beginPath(); c.arc(a + bv * 0.75, a + bv * 0.75, px * 0.035, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
  sprites.set(key, s); return s;
}
// Recessed empty board cell, cached like the blocks.
function cellSprite(size, ti){
  const key = 'cell' + ti + '@' + Math.round(size * 10), tc = THEMES[ti].cell;
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(4, Math.round(size * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), m = px * 0.04, w = px - 2 * m, r = px * 0.12;
  rr(c, m, m, w, w, r); c.fillStyle = tc[1]; c.fill();
  c.save(); rr(c, m, m, w, w, r); c.clip();
  const g = c.createLinearGradient(0, m, 0, m + w);
  g.addColorStop(0, tc[0]); g.addColorStop(0.3, tc[1]); g.addColorStop(1, tc[2]);
  rr(c, m, m + px * 0.06, w, w, r); c.fillStyle = g; c.fill();
  c.restore();
  sprites.set(key, s); return s;
}
function glowSprite(col, size){
  const key = 'glow' + col + '@' + Math.round(size * 10);
  let s = sprites.get(key); if (s) return s;
  const px = Math.max(8, Math.round(size * 2 * dpr));
  s = document.createElement('canvas'); s.width = s.height = px;
  const c = s.getContext('2d'), g = c.createRadialGradient(px / 2, px / 2, px * 0.12, px / 2, px / 2, px / 2);
  g.addColorStop(0, shade(COLORS[col], 0.55)); g.addColorStop(0.45, COLORS[col]); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = 0.55; c.fillStyle = g; c.fillRect(0, 0, px, px);
  sprites.set(key, s); return s;
}
function block(col, x, y, s, a = 1, sc = 1){
  const img = sprite(col, s);
  ctx.globalAlpha = a;
  if (sc !== 1){ const d = s * sc; ctx.drawImage(img, x + (s - d) / 2, y + (s - d) / 2, d, d); }
  else ctx.drawImage(img, x, y, s, s);
  ctx.globalAlpha = 1;
}

// ---------- effects ----------
const clears = [], popups = [], parts = [], placed = [], beams = [], sparks = [], rings = [];
let shakeT = 0, shakeAmp = 0, spawnT = performance.now(), flashT = -1e9, flashA = 0;
let fly = null;   // a piece flying back to the tray after an invalid drop
let comboCol = null;   // while a long chain is alive every block on the board shows this colour
let overT = 0;   // when the board jammed, for the No Space moment
const GRADS = { gold: ['#fff6a8', '#ffc21a', '#ff8a00'], pink: ['#ffd1f0', '#ff6fd0', '#c43cff'], mint: ['#e4fff4', '#5cf2c0', '#13b3a0'], fire: ['#fffbe0', '#ffb22e', '#ff3b2f'], ice: ['#ffffff', '#cfe6ff', '#7fa8ff'] };
function popup(text, x, y, size, color, big){ popups.push({ text, x, y, size, color, big, t0: performance.now() }); }
function star(c, x, y, r){
  c.beginPath();
  for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, q = i % 2 ? r * 0.28 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  c.closePath(); c.fill();
}

// ---------- audio / haptics ----------
let AC = null, OUT = null, NOISE = null;
function audioInit(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      OUT = AC.createGain(); OUT.gain.value = 0.9; OUT.connect(comp).connect(AC.destination);
      NOISE = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
// One enveloped oscillator; f2 slides the pitch over the note.
function tone(f, d, type = 'sine', v = 0.12, when = 0, f2 = 0){
  if (!AC || muted) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(OUT); o.start(t); o.stop(t + d + 0.02);
}
// Filtered noise burst for clicks, thuds and whooshes; f2 sweeps the filter.
function noise(f, d, v = 0.1, when = 0, f2 = 0, q = 1.2){
  if (!AC || muted) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(f, t);
  if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(bp).connect(g).connect(OUT); s.start(t); s.stop(t + d + 0.02);
}
const bell = (f, v, when) => { tone(f, 0.35, 'sine', v, when); tone(f * 2.01, 0.18, 'sine', v * 0.35, when); tone(f * 3.98, 0.08, 'triangle', v * 0.15, when); };
const sfx = {
  pick(){ tone(520, 0.07, 'sine', 0.08, 0, 820); noise(3000, 0.03, 0.04); },
  place(){ tone(150, 0.12, 'sine', 0.16, 0, 70); noise(900, 0.06, 0.12, 0, 300, 0.8); tone(420, 0.05, 'triangle', 0.04, 0.005); },
  clear(n, st){
    const base = 440 * Math.pow(2, Math.min(st - 1, 9) * 2 / 12);
    noise(400, 0.35, 0.09, 0, 6000, 0.7);
    const steps = [0, 4, 7, 12, 16, 19, 24, 28];
    for (let k = 0; k < Math.min(n + 3, steps.length); k++) bell(base * Math.pow(2, steps[k] / 12), 0.09, k * 0.05);
    if (n >= 3 || st >= 4){
      tone(70, 0.5, 'sine', 0.25, 0, 40);
      [0, 4, 7, 11].forEach(s => tone(base * Math.pow(2, s / 12) / 2, 0.6, 'triangle', 0.05, 0.12));
    }
  },
  boardClear(){ [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => bell(523 * Math.pow(2, s / 12), 0.1, 0.25 + k * 0.07)); },
  bad(){ tone(220, 0.16, 'triangle', 0.08, 0, 120); noise(500, 0.08, 0.05); },
  fly(){ tone(700, 0.12, 'sine', 0.05, 0, 380); },
  over(){ [523, 440, 349, 262].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, i * 0.16, f * 0.94)); tone(110, 0.8, 'sine', 0.12, 0.6, 55); },
};
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch {} }

// ---------- input ----------
let drag = null;
function pt(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function snapFor(d){
  const p = tray[d.i]; if (!p) return null;
  const { cell } = L;
  const lift = d.touch ? p.h * cell / 2 + cell * 1.25 : 0;
  const cx = d.x, cy = d.y - lift;
  const left = cx - p.w * cell / 2, top = cy - p.h * cell / 2;
  const c = Math.round((left - L.bx) / cell), r = Math.round((top - L.by) / cell);
  return { left, top, r, c, ok: canPlace(grid, p, r, c) };
}
cv.addEventListener('pointerdown', e => {
  if (over) return;
  const { x, y } = pt(e);
  if (y < L.ty - L.cell * 0.6) return;
  const i = Math.min(2, Math.max(0, Math.floor(x / (L.W / 3))));
  if (!tray[i]) return;
  e.preventDefault();
  audioInit();
  if (fly && fly.i === i) fly = null;
  drag = { i, x, y, x0: x, y0: y, t0: performance.now(), touch: e.pointerType !== "mouse", id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch {}
  sfx.pick(); buzz(6);
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  const { x, y } = pt(e); drag.x = x; drag.y = y;
});
function endDrag(e, cancel){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const s = cancel ? null : snapFor(drag);
  const i = drag.i, d = drag; drag = null;
  if (s && s.ok) place(i, s.r, s.c);
  else {
    if (d.cx !== undefined) fly = { i, cx: d.cx, cy: d.cy, sz: d.sz, t0: performance.now() };
    if (s && s.top < L.by + L.b){ sfx.bad(); buzz(12); } else sfx.fly();
  }
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });

// ---------- placing ----------
const WORDS = ['', '', 'Great!', 'Amazing!', 'Incredible!', 'Unreal!', 'Legendary!'];
const BANNERS = { 5: 'On Fire!', 8: 'Unstoppable!', 12: 'Combo Legend!' };   // keyed by the on-screen combo number
const COMBO_MODE = 4;   // chain length at which the board recolours
function place(i, r, c){
  const p = tray[i], now = performance.now();
  for (const [dr, dc] of p.cells){ grid[r + dr][c + dc] = p.color; placed.push({ r: r + dr, c: c + dc, t0: now }); }
  tray[i] = null;
  const { rows, cols } = fullLines(grid);
  const n = rows.length + cols.length;
  let res;
  if (n){
    const seen = new Set(); let sx = 0, sy = 0, k = 0;
    const add = (rr2, cc2) => {
      const key = rr2 * N + cc2; if (seen.has(key)) return; seen.add(key);
      const x = L.bx + cc2 * L.cell, y = L.by + rr2 * L.cell;
      const d = (rows.includes(rr2) ? cc2 : rr2) * 22;
      clears.push({ x, y, col: grid[rr2][cc2], t0: now, d });
      const np = 2 + Math.min(n, 4);
      for (let q = 0; q < np; q++) parts.push({ x: x + L.cell / 2, y: y + L.cell / 2, vx: (Math.random() - .5) * 9, vy: (Math.random() - .95) * 9, s: L.cell * (0.22 + Math.random() * 0.2), rot: Math.random() * 6, vr: (Math.random() - .5) * 0.4, col: grid[rr2][cc2], t0: now + d, life: 650 + Math.random() * 450 });
      if (Math.random() < 0.35) sparks.push({ x: x + Math.random() * L.cell, y: y + Math.random() * L.cell, t0: now + d, life: 500 + Math.random() * 300, s: L.cell * (0.25 + Math.random() * 0.25) });
      sx += x; sy += y; k++;
    };
    rows.forEach(rr2 => { beams.push({ row: rr2, t0: now }); for (let cc2 = 0; cc2 < N; cc2++) add(rr2, cc2); });
    cols.forEach(cc2 => { beams.push({ col: cc2, t0: now }); for (let rr2 = 0; rr2 < N; rr2++) add(rr2, cc2); });
    rows.forEach(rr2 => grid[rr2].fill(-1));
    cols.forEach(cc2 => { for (let rr2 = 0; rr2 < N; rr2++) grid[rr2][cc2] = -1; });
    const boardClear = grid.every(row => row.every(v => v < 0));
    res = GBScore.place(sc, { cells: p.cells.length, lines: n, rows: rows.length, cols: cols.length, boardClear });
    const streak = res.chain;   // true chain length, drives effects
    const cx = sx / k + L.cell / 2, cy = sy / k + L.cell / 2;
    if (res.lineScore) popup('+' + res.lineScore, cx, cy, L.cell * 0.9, '#fff');
    if (n >= 2) popup(WORDS[Math.min(n, 6)], L.W / 2, L.by + L.b * 0.3, L.cell * (0.85 + Math.min(n, 5) * 0.08), 'gold', true);
    if (res.comboText) popup(res.comboText, L.W / 2, L.by + L.b * (n >= 2 ? 0.52 : 0.4), L.cell * Math.min(1.7, 0.95 + res.combo * 0.07), 'pink', true);
    const banner = BANNERS[res.combo] || (res.combo > 12 && res.combo % 4 === 0 ? 'Combo Legend!' : '');
    if (banner){
      popup(banner, L.W / 2, L.by + L.b * 0.72, L.cell * 1.05, 'fire', true);
      for (let q = 0; q < 26; q++) sparks.push({ x: L.W / 2 + (Math.random() - .5) * L.b * 0.9, y: L.by + L.b * (0.6 + Math.random() * 0.25), t0: now + Math.random() * 400, life: 600 + Math.random() * 500, s: L.cell * (0.3 + Math.random() * 0.4) });
    }
    if (streak >= COMBO_MODE && comboCol === null){
      comboCol = p.color;
      for (let r2 = 0; r2 < N; r2++) for (let c2 = 0; c2 < N; c2++) if (grid[r2][c2] >= 0) placed.push({ r: r2, c: c2, t0: now + (r2 + c2) * 18 });
    }
    if (boardClear){ sfx.boardClear(); flashT = now; flashA = 0.6; popup(res.bonus ? 'Board clear! +' + res.bonus : 'Board clear!', L.W / 2, L.by + L.b * 0.6, L.cell * 0.75, 'mint', true); }
    $('#score').classList.add('bump'); setTimeout(() => $('#score').classList.remove('bump'), 140);
    const huge = n >= 3 || streak >= 4;
    if (huge){
      flashT = now; flashA = Math.min(0.55, 0.18 + n * 0.08 + streak * 0.02);
      rings.push({ x: cx, y: cy, t0: now }, { x: cx, y: cy, t0: now + 120 });
      for (let q = 0; q < 14 + n * 4; q++) sparks.push({ x: cx + (Math.random() - .5) * L.b * 0.8, y: cy + (Math.random() - .5) * L.b * 0.5, t0: now + Math.random() * 300, life: 500 + Math.random() * 400, s: L.cell * (0.3 + Math.random() * 0.35) });
    }
    shakeT = now; shakeAmp = Math.min(3 + n * 2.5 + streak, huge ? 20 : 14);
    sfx.clear(n, Math.max(1, streak)); buzz(huge ? [30, 30, 40, 30, 60] : n >= 2 ? [20, 30, 30] : 18);
  } else {
    res = GBScore.place(sc, { cells: p.cells.length, lines: 0, rows: 0, cols: 0, boardClear: false });
    sfx.place(); buzz(8);
  }
  if (sc.chain < COMBO_MODE) comboCol = null;
  score += res.gain;
  if (score > best){ best = score; store.set(BKEY, String(best)); }
  applyTheme(themeFor(score));
  if (tray.every(x => !x)){ tray = newSet(); spawnT = now; }
  updateHud();
  if (!tray.some(q => q && firstFit(grid, q))){
    over = true; store.del(KEY); overT = now + 350;
    setTimeout(() => { popup('No Space!', L.W / 2, L.by + L.b * 0.5, L.cell * 1.3, 'ice', true); sfx.bad(); buzz(30); }, 350);
    setTimeout(gameOver, 1900);
  } else save();
}
function gameOver(){
  sfx.over(); buzz([40, 60, 80]);
  $('#oscore').textContent = score;
  $('#obest').textContent = best;
  $('#newbest').classList.toggle('on', score > bestAtStart && score > 0);
  $('#over').classList.add('show');
}

// ---------- hud ----------
function updateHud(force){
  $('#best').textContent = best;
  const st = $('#streak');
  const label = GBScore.comboLabel(sc);
  if (label){ st.textContent = label; st.classList.add('on'); } else st.classList.remove('on');
  if (force) $('#score').textContent = score;
}
$('#mute').textContent = muted ? '🔇' : '🔊';
$('#mute').addEventListener('click', () => { muted = !muted; store.set(MKEY, muted ? '1' : '0'); $('#mute').textContent = muted ? '🔇' : '🔊'; audioInit(); });
$('#restart').addEventListener('click', () => { if (over || score === 0 || confirm('Start a new game?')) reset(); });
$('#again').addEventListener('click', () => { audioInit(); reset(); });

// ---------- render ----------
function frame(now){
  const { W, H, b, cell, bx, by } = L;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sk = now - shakeT < 260 ? shakeAmp * (1 - (now - shakeT) / 260) : 0;
  if (sk) ctx.translate((Math.random() - .5) * sk, (Math.random() - .5) * sk);

  // board: raised frame, dark well, recessed cells
  const fr = Math.max(6, cell * 0.16);
  ctx.fillStyle = 'rgba(6,12,60,.45)'; rr(ctx, bx - fr, by - fr + 6, b + 2 * fr, b + 2 * fr, 18); ctx.fill();
  const fg = ctx.createLinearGradient(0, by - fr, 0, by + b + fr);
  const tk = Math.min(1, (now - themeT0) / 1500), T0 = THEMES[themePrev], T1 = THEMES[themeIdx];
  fg.addColorStop(0, mixHex(T0.frame[0], T1.frame[0], tk)); fg.addColorStop(0.08, mixHex(T0.frame[1], T1.frame[1], tk)); fg.addColorStop(1, mixHex(T0.frame[2], T1.frame[2], tk));
  rr(ctx, bx - fr, by - fr, b + 2 * fr, b + 2 * fr, 18); ctx.fillStyle = fg; ctx.fill();
  rr(ctx, bx - 3, by - 3, b + 6, b + 6, 12); ctx.fillStyle = mixHex(T0.well, T1.well, tk); ctx.fill();
  const cs = cellSprite(cell, themeIdx), cs0 = tk < 1 ? cellSprite(cell, themePrev) : null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    if (cs0){ ctx.drawImage(cs0, bx + c * cell, by + r * cell, cell, cell); ctx.globalAlpha = tk; }
    ctx.drawImage(cs, bx + c * cell, by + r * cell, cell, cell); ctx.globalAlpha = 1;
  }
  if (comboCol !== null){
    const gl = glowSprite(comboCol, cell);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55 + Math.sin(now / 160) * 0.25;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] >= 0) ctx.drawImage(gl, bx + (c - 0.5) * cell, by + (r - 0.5) * cell, cell * 2, cell * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  // preview
  const s = drag ? snapFor(drag) : null;
  const p = drag ? tray[drag.i] : null;
  let hl = null;
  if (s && s.ok){
    const sim = grid.map(row => row.slice());
    for (const [dr, dc] of p.cells) sim[s.r + dr][s.c + dc] = p.color;
    const { rows, cols } = fullLines(sim);
    if (rows.length || cols.length){
      hl = new Set();
      rows.forEach(r => { for (let c = 0; c < N; c++) hl.add(r * N + c); });
      cols.forEach(c => { for (let r = 0; r < N; r++) hl.add(r * N + c); });
    }
  }

  // placed blocks
  for (let i = placed.length - 1; i >= 0; i--) if (now - placed[i].t0 > 220) placed.splice(i, 1);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const v = grid[r][c]; if (v < 0) continue;
    let sc = 1;
    const pa = placed.find(q => q.r === r && q.c === c);
    if (pa){ const k = Math.max(0, (now - pa.t0) / 220); sc = 1 + Math.sin(k * Math.PI) * 0.12; }
    const col = hl && hl.has(r * N + c) ? p.color : comboCol !== null ? comboCol : v;
    block(col, bx + c * cell, by + r * cell, cell, 1, sc);
  }
  if (s && s.ok){
    for (const [dr, dc] of p.cells){
      const key = (s.r + dr) * N + s.c + dc;
      block(p.color, bx + (s.c + dc) * cell, by + (s.r + dr) * cell, cell, hl && hl.has(key) ? 0.9 : 0.42);
    }
  }
  if (hl){
    const pulse = 0.18 + Math.sin(now / 90) * 0.1;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    hl.forEach(key => { const r = key / N | 0, c = key % N; rr(ctx, bx + c * cell + 2, by + r * cell + 2, cell - 4, cell - 4, cell * 0.14); ctx.fill(); });
  }

  // clearing blocks
  for (let i = clears.length - 1; i >= 0; i--){
    const q = clears[i], k = (now - q.t0 - q.d) / 380;
    if (k > 1){ clears.splice(i, 1); continue; }
    if (k < 0){ block(q.col, q.x, q.y, cell); continue; }
    block(q.col, q.x, q.y, cell, 1 - k, 1 + k * 0.25);
    ctx.globalAlpha = Math.max(0, 0.7 - k * 1.4); ctx.fillStyle = '#fff';
    rr(ctx, q.x + 2, q.y + 2, cell - 4, cell - 4, cell * 0.14); ctx.fill(); ctx.globalAlpha = 1;
  }
  // line beams
  ctx.globalCompositeOperation = 'lighter';
  for (let i = beams.length - 1; i >= 0; i--){
    const q = beams[i], k = (now - q.t0) / 460;
    if (k > 1){ beams.splice(i, 1); continue; }
    const th = cell * (0.9 + k * 0.9), a = (1 - k) * 0.85;
    const g = q.row !== undefined
      ? ctx.createLinearGradient(0, by + (q.row + 0.5) * cell - th / 2, 0, by + (q.row + 0.5) * cell + th / 2)
      : ctx.createLinearGradient(bx + (q.col + 0.5) * cell - th / 2, 0, bx + (q.col + 0.5) * cell + th / 2, 0);
    g.addColorStop(0, 'rgba(120,190,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(120,190,255,0)');
    ctx.fillStyle = g;
    if (q.row !== undefined) ctx.fillRect(bx - cell * 0.3, by + (q.row + 0.5) * cell - th / 2, b + cell * 0.6, th);
    else ctx.fillRect(bx + (q.col + 0.5) * cell - th / 2, by - cell * 0.3, th, b + cell * 0.6);
  }
  ctx.globalCompositeOperation = 'source-over';
  // flying mini-blocks
  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i], t = now - q.t0;
    if (t > q.life){ parts.splice(i, 1); continue; }
    if (t < 0) continue;
    q.x += q.vx; q.y += q.vy; q.vy += 0.38; q.vx *= 0.98; q.rot += q.vr;
    const sz = q.s * (1 - t / q.life * 0.4);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    ctx.globalAlpha = Math.min(1, 1.4 - t / q.life * 1.4);
    ctx.drawImage(sprite(q.col, cell * 0.4), -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // sparkles
  ctx.fillStyle = '#fff';
  for (let i = sparks.length - 1; i >= 0; i--){
    const q = sparks[i], t = now - q.t0;
    if (t > q.life){ sparks.splice(i, 1); continue; }
    if (t < 0) continue;
    const k = t / q.life;
    ctx.globalAlpha = 1 - k; star(ctx, q.x, q.y - k * cell * 0.4, q.s * Math.sin(Math.min(1, k * 2.5) * Math.PI / 2));
  }
  ctx.globalAlpha = 1;
  // shockwave rings and screen flash for big combos
  for (let i = rings.length - 1; i >= 0; i--){
    const q = rings[i], k = (now - q.t0) / 600;
    if (k > 1){ rings.splice(i, 1); continue; }
    if (k < 0) continue;
    ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = cell * 0.35 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(q.x, q.y, cell * 0.5 + k * b * 0.75, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const fk = (now - flashT) / 380;
  if (fk >= 0 && fk < 1){ ctx.fillStyle = `rgba(255,255,255,${flashA * (1 - fk)})`; rr(ctx, bx - fr, by - fr, b + 2 * fr, b + 2 * fr, 18); ctx.fill(); }

  // No Space: the board dims before the Game Over card
  if (over && now > overT){
    ctx.fillStyle = `rgba(5,8,30,${Math.min(0.5, (now - overT) / 900 * 0.5)})`;
    rr(ctx, bx - 3, by - 3, b + 6, b + 6, 12); ctx.fill();
  }
  // tray
  const slotW = W / 3, tyc = L.ty + L.th / 2;
  const sp = Math.min(1, (now - spawnT) / 260);
  for (let i = 0; i < 3; i++){
    const q = tray[i]; if (!q || (drag && drag.i === i) || (fly && fly.i === i)) continue;
    const fits = !!firstFit(grid, q);
    const ease = 1 - Math.pow(1 - Math.min(1, Math.max(0, sp * 1.6 - i * 0.25)), 3);
    const tc = L.tc * (0.4 + 0.6 * ease);
    const ox = (i + 0.5) * slotW - q.w * tc / 2, oy = tyc - q.h * tc / 2;
    for (const [dr, dc] of q.cells) block(q.color, ox + dc * tc, oy + dr * tc, tc, fits ? ease : 0.3 * ease);
  }
  if (fly){
    const q = tray[fly.i], k0 = (now - fly.t0) / 230;
    if (!q || k0 >= 1) fly = null;
    else {
      const k = 1 - Math.pow(1 - k0, 3), sz = fly.sz + (L.tc - fly.sz) * k;
      const cx = fly.cx + ((fly.i + 0.5) * slotW - fly.cx) * k, cy = fly.cy + (tyc - fly.cy) * k;
      for (const [dr, dc] of q.cells) block(q.color, cx - q.w * sz / 2 + dc * sz, cy - q.h * sz / 2 + dr * sz, sz);
    }
  }
  // dragged piece: grows from tray size to board size as it lifts toward the finger
  if (drag && p){
    const k0 = Math.min(1, (now - drag.t0) / 140), k = 1 - Math.pow(1 - k0, 3);
    const f = L.tc / cell + (1 - L.tc / cell) * k, sz = cell * f;
    const tcx = (drag.i + 0.5) * slotW, tcy = tyc;
    const cx = tcx + (s.left + p.w * cell / 2 - tcx) * k, cy = tcy + (s.top + p.h * cell / 2 - tcy) * k;
    const ox = cx - p.w * sz / 2, oy = cy - p.h * sz / 2;
    drag.cx = cx; drag.cy = cy; drag.sz = sz;
    ctx.fillStyle = 'rgba(4,8,40,.35)';
    for (const [dr, dc] of p.cells){ rr(ctx, ox + dc * sz + sz * 0.08, oy + dr * sz + sz * 0.2, sz * 0.92, sz * 0.92, sz * 0.14); ctx.fill(); }
    for (const [dr, dc] of p.cells) block(p.color, ox + dc * sz, oy + dr * sz, sz);
  }

  // popups: bouncy outlined words, big ones get a gradient fill
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (let i = popups.length - 1; i >= 0; i--){
    const q = popups[i], dur = q.big ? 1200 : 900, k = (now - q.t0) / dur;
    if (k > 1){ popups.splice(i, 1); continue; }
    const sc = k < 0.12 ? 0.3 + k / 0.12 * 0.95 : (k < 0.24 ? 1.25 - (k - 0.12) / 0.12 * 0.25 : 1);
    ctx.globalAlpha = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
    const fs = q.size * sc;
    ctx.font = `700 ${fs}px ${FONT}`;
    const y = q.y - k * cell * (q.big ? 0.6 : 1.2);
    ctx.lineWidth = fs * 0.22; ctx.strokeStyle = 'rgba(16,14,70,.9)';
    ctx.strokeText(q.text, q.x, y + fs * 0.06);
    const gr = GRADS[q.color];
    if (gr){
      const g = ctx.createLinearGradient(0, y - fs / 2, 0, y + fs / 2);
      g.addColorStop(0, gr[0]); g.addColorStop(0.5, gr[1]); g.addColorStop(1, gr[2]);
      ctx.fillStyle = g;
    } else ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x, y);
    ctx.globalAlpha = 1;
  }

  // score count-up
  if (dispScore !== score){
    dispScore += Math.max(1, Math.round((score - dispScore) * 0.18));
    if (dispScore > score) dispScore = score;
    $('#score').textContent = dispScore;
  }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();
if (!load()) tray = newSet();
applyTheme(themeFor(score), true);
updateHud(true);
if (!tray.some(q => q && firstFit(grid, q))) reset();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
